<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0c">
<title>Meus Treinos</title>
<meta name="apple-mobile-web-app-title" content="Treinos">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0c; --card: #17171a; --card2: #222226; --line: #2c2c31;
    --text: #ffffff; --muted: #8b8b93;
    --orange: #ff6a1a; --orange2: #ff8a3d;
    --green: #22c55e; --red: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: "Poppins", -apple-system, BlinkMacSystemFont, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  button { font-family: inherit; }
  main { padding: 0 20px 140px; max-width: 560px; margin: 0 auto; }

  /* Top bar */
  .top { display: flex; align-items: center; gap: 12px; padding: 18px 20px 10px; max-width: 560px; margin: 0 auto; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 2px solid var(--orange); }
  .mj-live { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 10px; border: 3px solid var(--green); }
  .rest .mj-live { border-color: var(--red); }
  .mj-done { width: 110px; height: 110px; border-radius: 50%; display: block; margin: 0 auto 10px; border: 3px solid var(--orange); }
  .hello small { display: block; color: var(--muted); font-size: 12px; }
  .hello b { font-size: 18px; }
  .icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--card); color: var(--text);
    display: grid; place-items: center; cursor: pointer; font-size: 18px; flex: none; }
  .top .title { flex: 1; text-align: center; font-weight: 600; font-size: 16px; }

  /* Hero */
  .hero { position: relative; overflow: hidden; background: linear-gradient(135deg, var(--orange), var(--orange2));
    border-radius: 22px; padding: 22px; margin: 10px 0 22px; }
  .hero small { font-size: 12px; font-weight: 500; opacity: .9; }
  .hero .big { font-size: 44px; font-weight: 800; line-height: 1.05; margin: 4px 0; }
  .hero .big span { font-size: 15px; font-weight: 600; opacity: .9; }
  .hero .pill { display: inline-block; background: #fff; color: #111; font-size: 12px; font-weight: 600;
    padding: 6px 14px; border-radius: 99px; margin-top: 6px; }
  .hero .deco { position: absolute; right: -30px; top: -30px; width: 170px; height: 170px; border-radius: 50%;
    border: 24px solid rgba(255,255,255,.14); }
  .hero .mj-hero { position: absolute; right: 16px; bottom: 16px; width: 96px; height: 96px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); object-fit: cover; }

  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 12px; }
  .section-head h2 { font-size: 17px; margin: 0; font-weight: 600; }
  .section-head span { color: var(--orange); font-size: 13px; }

  /* Workout cards */
  .w-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0;
    background: var(--card); color: var(--text); border-radius: 18px; padding: 14px; margin-bottom: 12px; cursor: pointer; }
  .w-letter { width: 56px; height: 56px; border-radius: 14px; background: var(--card2); display: grid; place-items: center;
    font-size: 24px; font-weight: 800; color: var(--orange); flex: none; }
  .w-info { flex: 1; min-width: 0; }
  .w-info b { display: block; font-size: 16px; font-weight: 600; }
  .w-info small { color: var(--muted); font-size: 12px; }
  .bar { height: 4px; background: var(--card2); border-radius: 4px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--orange); }
  .chev { color: var(--muted); font-size: 22px; }

  /* Workout detail */
  .w-hero { background: var(--card); border-radius: 22px; padding: 20px; margin: 6px 0 8px; position: relative; overflow: hidden; }
  .w-hero .deco { position: absolute; right: -40px; bottom: -60px; width: 180px; height: 180px; border-radius: 50%;
    border: 3px solid var(--orange); opacity: .5; }
  .w-hero small { color: var(--orange); font-weight: 600; font-size: 12px; letter-spacing: 1px; }
  .w-hero h1 { margin: 4px 0; font-size: 24px; font-weight: 700; }
  .w-hero p { margin: 0; color: var(--muted); font-size: 13px; }
  .group { font-size: 12px; font-weight: 600; letter-spacing: 1.5px; margin: 22px 0 10px; color: var(--muted); }
  .ex { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 18px; padding: 14px;
    margin-bottom: 10px; border: 2px solid transparent; cursor: pointer; transition: border-color .2s, background .2s; }
  .ex .num { position: relative; width: 64px; height: 64px; border-radius: 14px; background: var(--card2); display: grid; place-items: center;
    font-weight: 700; flex: none; }
  .ex .body { flex: 1; min-width: 0; }
  .ex .name { font-weight: 600; font-size: 15px; }
  .ex .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .wt { flex: none; border: 1.5px solid var(--orange); background: rgba(255,106,26,.12); color: #fff; border-radius: 14px;
    padding: 6px 10px; text-align: center; cursor: pointer; min-width: 74px; }
  .wt b { display: block; font-size: 16px; font-weight: 700; line-height: 1.15; white-space: nowrap; }
  .wt small { display: block; font-size: 10px; color: var(--orange2); letter-spacing: .5px; }
  .live-wt { display: inline-flex; align-items: center; gap: 10px; margin-top: 10px; border: 2px solid var(--orange);
    background: rgba(255,106,26,.12); color: #fff; border-radius: 99px; padding: 8px 18px; font-size: 22px; font-weight: 700; cursor: pointer; }
  .live-wt span { font-size: 12px; color: var(--orange2); font-weight: 500; }
  .sheet input { width: 100%; background: var(--bg); border: 2px solid var(--orange); border-radius: 14px; color: #fff;
    font: 700 24px "Poppins", sans-serif; padding: 12px 14px; text-align: center; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .steps button { border: 0; border-radius: 12px; padding: 12px 0; background: var(--card2); color: #fff; font: 600 15px "Poppins", sans-serif; cursor: pointer; }
  .ex.selected { border-color: var(--green); background: #10261a; }
  .ex.selected .num { background: var(--green); color: #fff; }
  .ex.done { opacity: .45; }
  .ex.done.selected { opacity: .85; }
  .ex.done .num { background: var(--orange); color: #fff; }

  .cta-wrap { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px calc(18px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 30%); }
  .cta { display: block; width: 100%; max-width: 520px; margin: 0 auto; border: 0; border-radius: 99px; padding: 17px;
    background: var(--orange); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  .cta.ghost { background: var(--card2); }
  .cta small { display: block; font-weight: 400; font-size: 12px; opacity: .85; }
  .finished { text-align: center; padding: 20px; color: var(--orange); font-weight: 700; font-size: 18px; }
  .link-btn { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }

  /* Fullscreen active exercise */
  .live { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 20px); z-index: 10;
    isolation: isolate; }
  .live::before, .live::after { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0;
    transition: opacity .7s ease; pointer-events: none; }
  .live::before { background: radial-gradient(circle at 50% 50%, #0f2e1c 0%, transparent 65%); }
  .live::after { background: radial-gradient(circle at 50% 50%, #3a1111 0%, transparent 65%); }
  .live.work::before, .live.rest::after { opacity: 1; }
  .live .top { padding: 0; width: 100%; }
  .live-head { text-align: center; margin-top: 14px; }
  .live-head .state { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 2px; padding: 6px 14px;
    border-radius: 99px; }
  .work .state { background: rgba(34,197,94,.15); color: var(--green); }
  .rest .state { background: rgba(239,68,68,.15); color: var(--red); }
  .live-head h1 { font-size: 22px; font-weight: 700; margin: 12px 0 2px; }
  .live-head p { margin: 0; color: var(--muted); font-size: 13px; }
  .ring-wrap { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 14px 0; container-type: size; }
  .ring { position: relative; width: min(100cqw, 100cqh, 340px); aspect-ratio: 1; container-type: inline-size; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { stroke: var(--card2); }
  .work .ring .prog { stroke: var(--green); filter: drop-shadow(0 0 8px rgba(34,197,94,.6)); }
  .rest .ring .prog { stroke: var(--red); filter: drop-shadow(0 0 8px rgba(239,68,68,.6)); }
  .ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .time { font-size: 22cqw; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .ring .label { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .stats { display: flex; gap: 10px; margin-bottom: 14px; flex: none; }
  .stat { flex: 1; background: var(--card); border-radius: 16px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 18px; }
  .stat small { color: var(--muted); font-size: 11px; }
  .live .actions { flex: none; display: flex; flex-direction: column; gap: 10px; }
  .btn { border: 0; border-radius: 99px; padding: 18px; font-size: 16px; font-weight: 600; color: #fff; cursor: pointer; }
  .btn.green { background: var(--green); }
  .btn.orange { background: var(--orange); }
  .btn.dark { background: var(--card2); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
  .sheet h3 { margin: 0; font-size: 18px; } .sheet p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
  .pic { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
  .ex .num { overflow: visible; padding: 0; }
  .ex .num .pic { border-radius: 14px; }
  .ex.selected .num { background: #1c3a27; }
  .ex.done .num { background: var(--card2); }
  .chk { position: absolute; right: -4px; top: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--green);
    color: #fff; font-size: 12px; display: grid; place-items: center; }
  .live-pic { width: 56px; height: 56px; background: var(--card); border-radius: 16px; display: grid; place-items: center; margin: 0 auto 4px; }
  @media (max-height: 720px) {
    .mj-live { width: 44px; height: 44px; margin-bottom: 6px; }
    .live-head h1 { font-size: 18px; margin-top: 8px; }
    .live-wt { font-size: 18px; padding: 6px 14px; margin-top: 6px; }
    .stat { padding: 8px; } .btn { padding: 14px; }
  }
  /* ---- Animações ---- */
  :root { --ease: cubic-bezier(.22, 1, .36, 1); }
  @keyframes inRight { from { opacity: 0; transform: translateX(40px); } }
  @keyframes inLeft  { from { opacity: 0; transform: translateX(-40px); } }
  @keyframes inUp    { from { opacity: 0; transform: translateY(18px); } }
  @keyframes zoomIn  { from { opacity: 0; transform: scale(.94); } }
  @keyframes fadeIn  { from { opacity: 0; } }
  @keyframes sheetUp { from { transform: translateY(100%); } }
  @keyframes pop     { 0% { transform: scale(1); } 40% { transform: scale(1.035); } 100% { transform: scale(1); } }
  @keyframes pulse   { 0% { transform: scale(1); } 35% { transform: scale(1.06); } 100% { transform: scale(1); } }
  @keyframes tick    { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }

  .nav-fwd main, .nav-fwd .top { animation: inRight .45s var(--ease) both; }
  .nav-back main, .nav-back .top { animation: inLeft .45s var(--ease) both; }
  .nav-fwd .w-card, .nav-back .w-card, .nav-fwd .ex, .nav-back .ex, .nav-fwd .group, .nav-fwd .w-hero, .nav-back .hero {
    animation: inUp .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms + 60ms); }
  .nav-fwd .cta-wrap, .nav-back .cta-wrap { animation: inUp .45s var(--ease) both .15s; }
  .nav-live .live { animation: zoomIn .45s var(--ease) both; }
  .nav-live .live-head, .nav-live .stats, .nav-live .actions { animation: inUp .5s var(--ease) both; }
  .nav-live .stats { animation-delay: .08s; } .nav-live .actions { animation-delay: .14s; }

  .ex, .w-card, .btn, .cta, .icon-btn, .wt, .live-wt, .steps button {
    transition: transform .18s var(--ease), background-color .3s, border-color .3s, opacity .3s, box-shadow .3s; }
  .ex:active, .w-card:active { transform: scale(.975); }
  .btn:active, .cta:active, .icon-btn:active, .wt:active, .live-wt:active, .steps button:active { transform: scale(.94); }
  .ex.pop { animation: pop .35s var(--ease); }
  .ex.selected { box-shadow: 0 0 0 4px rgba(34,197,94,.12); }
  .nav-back .chk { animation: tick .45s var(--ease) both .25s; }
  .bar i { transition: width .6s var(--ease); }

  .ring .prog { transition: stroke .5s ease, filter .5s ease; }
  .ring.flip { animation: pulse .5s var(--ease); }
  .ring .time { transition: color .3s; }
  .live-head .state, .mj-live { transition: background-color .5s, color .5s, border-color .5s; }
  .swap { animation: fadeIn .35s ease both; }

  .modal { animation: fadeIn .25s ease both; transition: opacity .22s ease; }
  .modal .sheet { animation: sheetUp .38s var(--ease) both; transition: transform .25s ease; }
  .modal.closing { opacity: 0; }
  .modal.closing .sheet { transform: translateY(100%); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  }
  /* Gesto de voltar (arrastar da borda esquerda) */
  html, body { overflow-x: hidden; }
  #app.dragging { box-shadow: -12px 0 30px rgba(0,0,0,.6); background: var(--bg); min-height: 100vh; }
  .underlay { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--bg); pointer-events: none; }
  .underlay::after { content: ""; position: absolute; inset: 0; background: #000; opacity: var(--shade, .5); }
  #app { position: relative; z-index: 1; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const REST_SECONDS = 60;
const WORK_RING_SECONDS = 60; // o anel verde completa uma volta a cada 60s de exercício

const WORKOUTS = [
  { id: "A", title: "Peito + Tríceps", emoji: "🏋️", groups: [
    { name: "PEITO", exercises: [
      { name: "Supino reto com barra", sets: 4, reps: "6–8", note: "Base de força", weight: "20 - 20 kg" },
      { name: "Supino inclinado com halteres", sets: 3, reps: "8–10", note: "Halteres > barra no inclinado", weight: "22 - 22 kg" },
      { name: "Peck deck / Crucifixo", sets: 3, reps: "12–15", note: "Finalização — pico de contração", weight: "60 kg" },
      { name: "Crossover na polia (baixo pra cima)", sets: 3, reps: "12–15", note: "Porção inferior + alongamento profundo", weight: "15 - 15 kg" },
    ]},
    { name: "TRÍCEPS", exercises: [
      { name: "Francês na polia (corda ou barra reta)", sets: 3, reps: "10–12", note: "Cabeça longa · tensão constante", weight: "— kg" },
      { name: "Bi-set: Corda + Barra reta na polia", sets: 3, reps: "12–15", note: "Sem descanso entre os dois · descansa depois", weight: "20 - 20 kg" },
    ]},
  ]},
  { id: "B", title: "Costas + Bíceps", emoji: "💪", groups: [
    { name: "COSTAS", exercises: [
      { name: "Puxada frontal", sets: 4, reps: "8–10", note: "Largura · puxada vertical", weight: "55 kg" },
      { name: "Remada baixa no cabo", sets: 4, reps: "8–10", note: "Espessura de costas", weight: "50 kg" },
      { name: "Remada unilateral com haltere", sets: 3, reps: "10–12", note: "Amplitude maior · grande dorsal", weight: "22 kg" },
      { name: "Pullover na polia ou haltere", sets: 3, reps: "12–15", note: "Isolamento do grande dorsal", weight: "40 kg / H 24 kg" },
    ]},
    { name: "BÍCEPS", exercises: [
      { name: "Rosca direta com barra", sets: 3, reps: "8–10", note: "Bíceps braquial — pico e comprimento", weight: "5 - 5 kg" },
      { name: "Rosca martelo", sets: 3, reps: "10–12", note: "Braquial + braquiorradial", weight: "10 - 10 kg" },
      { name: "Rosca scott", sets: 3, reps: "12–15", note: "Isolamento total — elimina trapaça", weight: "5 - 5 kg" },
    ]},
  ]},
  { id: "C", title: "Inferiores", emoji: "🦵", groups: [
    { name: "QUADRÍCEPS", exercises: [
      { name: "Agachamento livre ou Hack squat", sets: 4, reps: "6–8", note: "Composto base — insubstituível", weight: "50 - 50 kg" },
      { name: "Leg press 45°", sets: 4, reps: "10–12", note: "Volume complementar ao agacho", weight: "90 - 90 kg" },
      { name: "Extensora", sets: 3, reps: "15–20", note: "Isolamento de finalização", weight: "70 kg" },
    ]},
    { name: "POSTERIOR DE COXA", exercises: [
      { name: "Stiff com barra", sets: 4, reps: "8–10", note: "Base de força — essencial", weight: "20 - 20 kg" },
      { name: "Mesa flexora (leg curl deitado)", sets: 3, reps: "10–12", note: "Quadril estendido = maior alongamento", weight: "— kg" },
    ]},
    { name: "PANTURRILHA", exercises: [
      { name: "Panturrilha em pé na máquina", sets: 4, reps: "15–20", note: "Gastrocnêmio — maior e mais visível", weight: "180 kg (leg press)" },
    ]},
  ]},
];


// Fotos do Animoji fazendo cada exercício
const EX_IMG = {
  "Supino reto com barra": "img/01.jpg",
  "Supino inclinado com halteres": "img/02.jpg",
  "Peck deck / Crucifixo": "img/03.jpg",
  "Crossover na polia (baixo pra cima)": "img/04.jpg",
  "Francês na polia (corda ou barra reta)": "img/05.jpg",
  "Bi-set: Corda + Barra reta na polia": "img/06.jpg",
  "Puxada frontal": "img/07.jpg",
  "Remada baixa no cabo": "img/08.jpg",
  "Remada unilateral com haltere": "img/09.jpg",
  "Pullover na polia ou haltere": "img/10.jpg",
  "Rosca direta com barra": "img/11.jpg",
  "Rosca martelo": "img/12.jpg",
  "Rosca scott": "img/13.jpg",
  "Agachamento livre ou Hack squat": "img/14.jpg",
  "Leg press 45°": "img/15.jpg",
  "Extensora": "img/16.jpg",
  "Stiff com barra": "img/17.jpg",
  "Mesa flexora (leg curl deitado)": "img/18.jpg",
  "Panturrilha em pé na máquina": "img/19.jpg",
};
const icon = name => `<img class="pic" src="${EX_IMG[name]}" alt="" loading="lazy">`;

// Figurinhas do Animoji do usuário
const MJ = {
  fist: "img/20.jpg",
  peace: "img/23.jpg",
  sweat: "img/21.jpg",
  pray: "img/22.jpg",
  thumbsup: "img/21.jpg",
};

// ---- Pesos editáveis (salvos no aparelho) ----
let weights = (() => { try { return JSON.parse(localStorage.getItem("treinos-pesos")) || {}; } catch { return {}; } })();
const weightOf = (wid, i) => weights[`${wid}:${i}`] ?? flat(WORKOUTS.find(x => x.id === wid))[i].weight;
function editWeight(wid, i) {
  const e = flat(WORKOUTS.find(x => x.id === wid))[i];
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="sheet">
    <h3>Editar peso</h3><p>${esc(e.name)}<br>
    Digite o peso que você usa neste exercício. Se tiver um peso para cada lado (halteres, máquina), escreva os dois separados por traço, como <b>20 - 20 kg</b>.
    Os botões abaixo somam ou tiram peso de todos os números de uma vez.<br>Peso original do treino: <b>${esc(e.weight)}</b></p>
    <input id="wIn" value="${esc(weightOf(wid, i))}" autocomplete="off">
    <div class="steps">${[-5, -2.5, 2.5, 5].map(d => `<button data-d="${d}">${d > 0 ? "+" : ""}${String(d).replace(".", ",")}</button>`).join("")}</div>
    <button class="btn orange" id="wOk">Salvar</button>
    <button class="btn dark" id="wNo">Cancelar</button></div>`;
  document.body.appendChild(m);
  const inp = m.querySelector("#wIn");
  // +/- ajusta todos os números do texto (ex.: "20 - 20 kg" → "22,5 - 22,5 kg")
  m.querySelectorAll(".steps button").forEach(b => b.onclick = () => {
    const d = +b.dataset.d;
    inp.value = inp.value.replace(/\d+(?:[.,]\d+)?/g, n => {
      const v = Math.max(0, parseFloat(n.replace(",", ".")) + d);
      return String(+v.toFixed(2)).replace(".", ",");
    });
  });
  const close = () => closeModal(m);
  m.querySelector("#wNo").onclick = close;
  m.onclick = ev => { if (ev.target === m) close(); };
  m.querySelector("#wOk").onclick = () => {
    let v = inp.value.trim();
    if (v && !/kg/i.test(v) && /\d/.test(v)) v += " kg";
    if (v) weights[`${wid}:${i}`] = v; else delete weights[`${wid}:${i}`];
    try { localStorage.setItem("treinos-pesos", JSON.stringify(weights)); } catch {}
    close(); render();
  };
  inp.focus(); inp.select();
}

// ---- State ----
// sessão por treino:
// { selected, setsDone:{i:n}, done:{i:true}, times:{i:ms},
//   live: null | { i, phase:"work"|"rest", phaseStart:ms, restEnd:ms, workAccum:ms } }
let view = { workoutId: null };
let sessions = load() || {};
let tick = null, raf = null;

function load() { try { return JSON.parse(localStorage.getItem("treinos-v2")); } catch { return null; } }
function save() { try { localStorage.setItem("treinos-v2", JSON.stringify(sessions)); } catch {} }
function session(id) { return sessions[id] ||= { selected: null, setsDone: {}, done: {}, times: {}, live: null }; }
const flat = w => w.groups.flatMap(g => g.exercises);
const current = () => WORKOUTS.find(x => x.id === view.workoutId);

// ---- Som / vibração ----
let audioCtx;
function unlockAudio() { try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {} }
function beep() {
  try {
    unlockAudio();
    [0, 0.25, 0.5].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.3, audioCtx.currentTime + t);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.15);
    });
  } catch {}
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
}

// ---- Ações ----
let navAnim = "", popIdx = null;
function openWorkout(id) { view.workoutId = id; navAnim = "nav-fwd"; render(); }
function goHome() { view.workoutId = null; navAnim = "nav-back"; render(); }
function selectExercise(i) { const s = session(view.workoutId); if (s.selected !== i) popIdx = i; s.selected = i; save(); render(); }
function closeModal(m, after) { m.classList.add("closing"); setTimeout(() => { m.remove(); after && after(); }, 230); }

function startExercise() {
  const s = session(view.workoutId);
  unlockAudio();
  const i = s.selected;
  delete s.done[i]; // retomar exercício concluído: continua de onde parou
  s.live = { i, phase: "work", phaseStart: Date.now(), restEnd: null, workAccum: s.times[i] || 0 };
  navAnim = "nav-live"; save(); render();
}
function finishSet() {
  const s = session(view.workoutId), L = s.live;
  L.workAccum += Date.now() - L.phaseStart;
  s.setsDone[L.i] = (s.setsDone[L.i] || 0) + 1;
  L.phase = "rest"; L.phaseStart = Date.now(); L.restEnd = Date.now() + REST_SECONDS * 1000;
  save(); refreshLive();
}
function startNextSet() {
  const s = session(view.workoutId), L = s.live;
  L.phase = "work"; L.phaseStart = Date.now(); L.restEnd = null;
  save(); refreshLive();
}
function refreshLive() { if (document.getElementById("live")) update(false); else render(); }
function finishExercise() {
  const w = current(), s = session(w.id), L = s.live, list = flat(w);
  if (L.phase === "work") {
    const elapsed = Date.now() - L.phaseStart;
    L.workAccum += elapsed;
    if (elapsed > 3000) s.setsDone[L.i] = (s.setsDone[L.i] || 0) + 1; // conta a série em andamento
  }
  s.times[L.i] = L.workAccum;
  s.done[L.i] = true; s.live = null; navAnim = "nav-back";
  let next = null;
  for (let k = 1; k <= list.length; k++) { const j = (L.i + k) % list.length; if (!s.done[j]) { next = j; break; } }
  s.selected = next; save(); render();
}
function resetWorkout() {
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="sheet">
    <h3>Zerar treino?</h3><p>O progresso deste treino será apagado.</p>
    <button class="btn orange" id="mYes">Zerar</button>
    <button class="btn dark" id="mNo">Cancelar</button></div>`;
  document.body.appendChild(m);
  m.querySelector("#mNo").onclick = () => closeModal(m);
  m.onclick = e => { if (e.target === m) closeModal(m); };
  m.querySelector("#mYes").onclick = () => closeModal(m, () => { delete sessions[view.workoutId]; navAnim = "nav-fwd"; save(); render(); });
}

// ---- Render ----
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = ms => { const t = Math.max(0, Math.floor(ms / 1000)); return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
const app = document.getElementById("app");

function render() {
  clearInterval(tick); tick = null; cancelAnimationFrame(raf); raf = null;
  app.className = navAnim; navAnim = "";
  if (!view.workoutId) return renderHome();
  const s = session(view.workoutId);
  if (s.live) return renderLive();
  renderWorkout();
}

function renderHome() { app.innerHTML = homeHTML(); }
function homeHTML() {
  const totals = WORKOUTS.map(w => ({ w, total: flat(w).length, done: Object.keys(session(w.id).done).length }));
  const allEx = totals.reduce((a, t) => a + t.total, 0);
  return `
    <div class="top">
      <img class="avatar" src="${MJ.fist}" alt="">
      <div class="hello" style="flex:1"><small>Bem-vindo de volta</small><b>Ivan</b></div>
    </div>
    <main>
      <div class="hero">
        <div class="deco"></div>
        <small>Seu programa semanal</small>
        <div class="big">3 <span>treinos · ${allEx} exercícios</span></div>
        <div class="pill">Divisão A · B · C</div>
        <img class="mj-hero" src="${MJ.peace}" alt="">
      </div>
      <div class="section-head"><h2>Meus treinos</h2><span>Toque para abrir</span></div>
      ${totals.map(({ w, total, done }, k) => `
        <button class="w-card" style="--i:${k + 1}" onclick="openWorkout('${w.id}')">
          <div class="w-letter">${w.id}</div>
          <div class="w-info">
            <b>${esc(w.title)}</b>
            <small>${total} exercícios · ${done ? `${done}/${total} concluídos` : w.groups.map(g => g.name.toLowerCase()).join(" · ")}</small>
            <div class="bar"><i style="width:${(done / total) * 100}%"></i></div>
          </div>
          <div class="chev">›</div>
        </button>`).join("")}
    </main>`;
}

function renderWorkout() {
  const w = current(), s = session(w.id), list = flat(w);
  const allDone = list.every((_, i) => s.done[i]);
  let idx = 0;
  const sel = s.selected != null ? list[s.selected] : null;
  const resume = sel && s.done[s.selected];
  app.innerHTML = `
    <div class="top">
      <button class="icon-btn" onclick="goHome()" aria-label="Voltar">‹</button>
      <div class="title">Detalhe do treino</div>
      <button class="icon-btn" onclick="resetWorkout()" aria-label="Zerar" title="Zerar progresso">↺</button>
    </div>
    <main>
      <div class="w-hero"><div class="deco"></div>
        <small>TREINO ${w.id}</small>
        <h1>${esc(w.title)}</h1>
        <p>${list.length} exercícios · ${Object.keys(s.done).length} concluídos · descanso ${REST_SECONDS}s</p>
      </div>
      ${w.groups.map(g => `
        <div class="group">${esc(g.name)}</div>
        ${g.exercises.map(e => {
          const i = idx++;
          const cls = [s.done[i] && "done", s.selected === i && "selected"].filter(Boolean).join(" ");
          const n = s.setsDone[i] || 0;
          const extra = s.done[i] ? ` · ✓ ${n} série${n === 1 ? "" : "s"}${s.times[i] ? ` · ${fmt(s.times[i])}` : ""}` : "";
          return `<div class="ex ${cls}${popIdx === i ? " pop" : ""}" style="--i:${i + 1}" onclick="selectExercise(${i})">
            <div class="num">${icon(e.name)}${s.done[i] ? `<span class="chk">✓</span>` : ""}</div>
            <div class="body">
              <div class="name">${esc(e.name)}</div>
              <div class="meta">${e.sets} séries × ${e.reps} reps${extra}</div>
            </div>
            <button class="wt" onclick="event.stopPropagation(); editWeight('${w.id}', ${i})"><b>${esc(weightOf(w.id, i))}</b><small>✎ editar</small></button>
          </div>`;
        }).join("")}`).join("")}
      ${allDone ? `<div class="finished"><img class="mj-done" src="${MJ.thumbsup}" alt="">Treino concluído!<br><button class="link-btn" onclick="resetWorkout()">Zerar para a próxima vez</button></div>` : ""}
    </main>
    ${sel ? `<div class="cta-wrap"><button class="cta" onclick="startExercise()">${resume ? "Retomar exercício" : "Iniciar exercício"}<small>${esc(sel.name)}</small></button></div>`
         : allDone ? "" : `<div class="cta-wrap"><button class="cta ghost" disabled>Selecione um exercício</button></div>`}`;
  popIdx = null;
}

const R = 140, C = 2 * Math.PI * R;
function renderLive() {
  const w = current(), s = session(w.id), L = s.live, e = flat(w)[L.i];
  app.innerHTML = `
    <div class="live" id="live">
      <div class="top">
        <button class="icon-btn" onclick="finishExercise()" aria-label="Sair" title="Concluir exercício">✕</button>
        <div class="title">Treino ${w.id}</div>
        <div style="width:42px"></div>
      </div>
      <div class="live-head">
        <img class="mj-live" id="mj" alt="">
        <div class="state" id="state"></div>
        <h1>${esc(e.name)}</h1>
        <p>${e.sets} séries × ${e.reps} reps</p>
        <button class="live-wt" onclick="editWeight('${w.id}', ${L.i})">${esc(weightOf(w.id, L.i))} <span>✎</span></button>
      </div>
      <div class="ring-wrap">
        <div class="ring">
          <svg viewBox="0 0 320 320">
            <circle class="track" cx="160" cy="160" r="${R}" fill="none" stroke-width="16"/>
            <circle class="prog" id="prog" cx="160" cy="160" r="${R}" fill="none" stroke-width="16"
              stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
          </svg>
          <div class="center"><div class="time" id="time">00:00</div></div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><b id="setNum"></b><small>séries feitas</small></div>
        <div class="stat"><b>${e.sets}</b><small>meta</small></div>
      </div>
      <div class="actions" id="actions"></div>
    </div>`;
  update(true);
  const loop = () => { update(false); if (session(view.workoutId).live) raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);
}

function update(firstPaint) {
  const s = session(view.workoutId), L = s.live;
  if (!L) return;
  const now = Date.now(), live = document.getElementById("live");
  if (!live) return;
  const n = s.setsDone[L.i] || 0;

  if (L.phase === "rest" && now >= L.restEnd) { beep(); startNextSet(); return; }

  const isWork = L.phase === "work";
  if (live.className !== `live ${L.phase}` || firstPaint) {
    if (!firstPaint) {
      const ring = live.querySelector(".ring");
      ring.classList.remove("flip"); void ring.offsetWidth; ring.classList.add("flip");
      ["mj", "state", "actions"].forEach(id => { const el = document.getElementById(id); el.classList.remove("swap"); void el.offsetWidth; el.classList.add("swap"); });
    }
    live.className = `live ${L.phase}`;
    document.getElementById("mj").src = isWork ? EX_IMG[flat(current())[L.i].name] : MJ.pray;
    document.getElementById("state").textContent = isWork ? `SÉRIE ${n + 1} EM ANDAMENTO` : "DESCANSO";
    document.getElementById("setNum").textContent = n;
    document.getElementById("actions").innerHTML = isWork
      ? `<button class="btn green" onclick="finishSet()">✓ Série concluída</button>
         <button class="btn dark" onclick="finishExercise()">Concluir exercício</button>`
      : `<button class="btn orange" onclick="startNextSet()">Pular descanso</button>
         <button class="btn dark" onclick="finishExercise()">Concluir exercício</button>`;
  }

  let frac, shown;
  if (isWork) {
    const el = now - L.phaseStart;
    shown = fmt(el);
    frac = (el % (WORK_RING_SECONDS * 1000)) / (WORK_RING_SECONDS * 1000);
    if (el >= WORK_RING_SECONDS * 1000 && frac < 0.01) frac = 1;
  } else {
    const left = L.restEnd - now;
    shown = fmt(left + 999);
    frac = 1 - left / (REST_SECONDS * 1000);
  }
  document.getElementById("time").textContent = shown;
  document.getElementById("prog").setAttribute("stroke-dashoffset", C * (1 - Math.min(1, Math.max(0, frac))));
}

// ---- Voltar arrastando da borda esquerda (como no iPhone) ----
(() => {
  const EDGE = 28;
  let startX = 0, startY = 0, t0 = 0, dx = 0, active = false, decided = false, under = null;
  const W = () => window.innerWidth;
  const canGoBack = () => view.workoutId && !session(view.workoutId).live && !document.querySelector(".modal");
  const setX = x => {
    app.style.transform = `translateX(${x}px)`;
    const p = Math.min(1, x / W());
    if (under) { under.style.transform = `translateX(${(p - 1) * 30}%)`; under.style.setProperty("--shade", (1 - p) * .5); }
  };
  addEventListener("touchstart", e => {
    const t = e.touches[0];
    if (e.touches.length !== 1 || t.clientX > EDGE || !canGoBack()) return;
    active = true; decided = false; startX = t.clientX; startY = t.clientY; t0 = performance.now(); dx = 0;
  }, { passive: true });
  addEventListener("touchmove", e => {
    if (!active) return;
    const t = e.touches[0], mx = t.clientX - startX, my = t.clientY - startY;
    if (!decided) {
      if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      if (Math.abs(my) > Math.abs(mx) || mx < 0) { active = false; return; } // rolagem vertical: ignora
      decided = true;
      under = document.createElement("div");
      under.className = "underlay"; under.innerHTML = homeHTML();
      document.body.prepend(under);
      app.classList.add("dragging"); app.style.transition = "none"; under.style.transition = "none";
    }
    e.preventDefault();
    dx = Math.max(0, mx); setX(dx);
  }, { passive: false });
  const end = () => {
    if (!active) return;
    active = false;
    if (!decided) return;
    const v = dx / Math.max(1, performance.now() - t0);
    const go = dx > W() * .35 || (v > .5 && dx > 40);
    const ease = "cubic-bezier(.22,1,.36,1)", dur = go ? 280 : 320;
    app.style.transition = `transform ${dur}ms ${ease}`;
    under.style.transition = `transform ${dur}ms ${ease}`;
    requestAnimationFrame(() => setX(go ? W() : 0));
    setTimeout(() => {
      app.classList.remove("dragging"); app.style.transition = ""; app.style.transform = "";
      under.remove(); under = null;
      if (go) { view.workoutId = null; render(); }
    }, dur);
  };
  addEventListener("touchend", end);
  addEventListener("touchcancel", end);
})();

document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
render();
</script>
</body>
</html>
