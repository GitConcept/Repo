name: Live semanal -> Hotmart

on:
  schedule:
    # A cada 4 horas, todos os dias. Roda no Mac (runner self-hosted): se ele estiver
    # desligado, a execução fica na fila e roda quando o Mac ligar.
    # Não duplica: gravações já enviadas ficam registradas em processed.json.
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Testar sem publicar (para antes do botão Publicar)"
        type: boolean
        default: true
      cursos_ja_publicados:
        description: "Cursos já publicados à mão para a live pendente (ex.: 1 ou 1,2)"
        type: string
        default: ""
      pausar_no_upload:
        description: "Parar na tela de envio do vídeo e esperar 30 min (para fazer à mão)"
        type: boolean
        default: false

concurrency:
  group: live-hotmart
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # Impede o Mac de entrar em repouso enquanto o robô trabalha (encerrado no fim do job).
      - name: Manter o Mac acordado
        run: nohup caffeinate -i -t 18000 >/dev/null 2>&1 &

      # Usa o Python do próprio Mac num ambiente fixo fora da pasta de trabalho, para não
      # reinstalar tudo a cada checagem (só instala de novo se requirements.txt mudar).
      - name: Instalar dependências
        run: |
          VENV="$HOME/.automacao-lives/venv"
          if ! cmp -s requirements.txt "$VENV/requirements.txt"; then
            rm -rf "$VENV"
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install -q -r requirements.txt
            "$VENV/bin/python" -m playwright install chromium
            cp requirements.txt "$VENV/requirements.txt"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Drive -> Hotmart
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          MEET_NAME_FILTER: ${{ vars.MEET_NAME_FILTER }}
          START_DATE: ${{ vars.START_DATE }}
          HOTMART_MODULE_URL: ${{ secrets.HOTMART_MODULE_URL }}
          HOTMART_MODULE_NAME: ${{ vars.HOTMART_MODULE_NAME || 'LIVES SEMANAIS' }}
          PAUSE_AT_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.pausar_no_upload || 'false' }}
          ALREADY_DONE_COURSES: ${{ inputs.cursos_ja_publicados }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        working-directory: src
        run: |
          cp ../processed.json .
          status=0
          python main.py || status=$?
          # Guarda o progresso mesmo em caso de erro, para não repetir um curso já publicado.
          cp processed.json ../processed.json
          exit $status

      - name: Salvar capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-hotmart
          path: src/debug/
          if-no-files-found: ignore

      - name: Registrar gravação processada
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed.json
          git diff --cached --quiet || (git commit -m "Registra live enviada à Hotmart" && git pull --rebase && git push)
