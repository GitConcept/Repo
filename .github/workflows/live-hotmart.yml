name: Live semanal -> Hotmart

on:
  schedule:
    # Sexta 02:17, 04:17 e 07:17 UTC = quinta 23:17, sexta 01:17 e 04:17 (Brasília).
    # Várias tentativas porque o Meet pode demorar para gerar a gravação.
    # Não duplica: gravações já enviadas ficam registradas em processed.json.
    - cron: "17 2,4,7 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Testar sem publicar (para antes do botão Publicar)"
        type: boolean
        default: true

concurrency:
  group: live-hotmart
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Drive -> Hotmart
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          MEET_NAME_FILTER: ${{ vars.MEET_NAME_FILTER }}
          HOTMART_EMAIL: ${{ secrets.HOTMART_EMAIL }}
          HOTMART_PASSWORD: ${{ secrets.HOTMART_PASSWORD }}
          HOTMART_TOTP_SECRET: ${{ secrets.HOTMART_TOTP_SECRET }}
          HOTMART_MODULE_URL: ${{ secrets.HOTMART_MODULE_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        working-directory: src
        run: |
          cp ../processed.json .
          status=0
          python main.py || status=$?
          # Guarda o progresso mesmo em caso de erro, para não repetir um curso já publicado.
          cp processed.json ../processed.json
          exit $status

      - name: Salvar capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-hotmart
          path: src/debug/
          if-no-files-found: ignore

      - name: Registrar gravação processada
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed.json
          git diff --cached --quiet || (git commit -m "Registra live enviada à Hotmart" && git push)
